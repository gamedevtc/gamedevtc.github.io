name = "portfolio-assistant"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Lets src/index.js import assistant-kb.md as a plain string at build time.
# The knowledge base carries positioning and framing notes that should not sit
# in the public portfolio repo, so it is gitignored and travels only inside the
# deployed bundle. Keep a backup of it: it is not in version control.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = false

[vars]
# Origins allowed to call this worker. Comma-separated, no trailing slash.
# Add "http://localhost:8000" while testing the site locally.
ALLOWED_ORIGINS = "https://gamedevtc.github.io"

# Where the worker fetches the knowledge base and resume data from.
SITE_ORIGIN = "https://gamedevtc.github.io"

# Server-side kill switch. Set to "false" to make the endpoint refuse all
# traffic without touching the site or deleting the worker.
ASSISTANT_ENABLED = "true"

# ── Rate limiting, layer 1: burst protection ──
# Strongly consistent and evaluated at the edge, with no write quota. This is
# the layer that actually stops rapid-fire abuse. KV cannot do this job: its
# reads are cached for up to 60s, so a burst reads a stale counter and sails
# through. namespace_id is just a unique number you pick per limiter.
[[ratelimits]]
name = "BURST_LIMIT"
namespace_id = "1001"

  # Enforcement is permissive: measured, it let ~16 through before clamping, so
  # treat the effective ceiling as roughly double this number. 5 leaves plenty of
  # headroom for a real visitor, who cannot read a streamed answer and ask again
  # faster than about 4 times a minute.
  [ratelimits.simple]
  limit = 5
  period = 60

# ── Rate limiting, layer 2: daily ceiling ──
# KV's eventual consistency is fine across 24 hours. Caps sustained abuse that
# stays politely under the burst limit.
# Created with:  npx wrangler kv namespace create RATE_LIMIT
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "caabce8e55bc4e8996542db83b6b5722"

# Secrets are NOT set here. Set them with:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put RATE_LIMIT_SALT      (any random string)
#   npx wrangler secret put TURNSTILE_SECRET     (optional)
